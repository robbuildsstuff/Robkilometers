<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>robkilometers</title>
<meta name="description" content="Rob — building something. Back soon.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#ECE8DD;
    --ink:#26251F;
    --olive:#8A7B4E;
    --olive-deep:#5F5535;
    --rust:#E9631A;
    --sage:#A6AE9D;
    --line:#C9C2AE;
    --white:#FAF9F4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:100vh;
    padding:28px;
  }
  .display{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
  }
  .center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  h1{
    font-size:clamp(36px, 8vw, 72px);
    margin:0 0 22px 0;
    line-height:0.98;
  }
  .status-line{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--white);
    border:1px solid var(--ink);
    border-radius:2px;
    padding:7px 14px 7px 10px;
    color:var(--olive-deep);
  }
  .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--rust);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.35;transform:scale(0.75);}
  }
  .footer-bar{
    display:flex;
    justify-content:space-between;
    color:var(--sage);
  }
  a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  a:hover{border-bottom-color:var(--rust);color:var(--rust);}
</style>
</head>
<body>

  <div class="topbar mono">
    <div>Robkilometers</div>
    <div>43.65&deg;N, 79.38&deg;W</div>
  </div>

  <div class="center">
    <h1 class="display">Building<br>something.</h1>
    <div class="status-line mono">
      <span class="dot"></span>
      In progress &mdash; back soon
    </div>
  </div>

  <div class="footer-bar mono">
    <div>&copy; 2026</div>
    <div><a href="mailto:hello@robkilometers.ca">hello@robkilometers.ca</a></div>
  </div>

</body>
</html>
